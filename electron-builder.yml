# Portable build: a self-contained folder (release/win-unpacked) with Plunder.exe.
# No installer. CI zips it as Plunder-win-x64.zip; see .github/workflows/desktop.yml.
appId: com.littlebutta.plunder
productName: Plunder
executableName: Plunder
copyright: Copyright © 2026 Devin

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - "!electron/dev.mjs"
  - package.json
  # Steam (online play): only the Windows binaries are needed
  - "!node_modules/steamworks.js/dist/linux64"
  - "!node_modules/steamworks.js/dist/osx"
  - "!node_modules/steamworks.js/dist/win64/*.lib"

asar: true
# native code and the Steam DLL must sit on disk, not inside the archive
asarUnpack:
  - node_modules/steamworks.js/**
publish: null

win:
  target:
    - target: dir
      arch: [x64]
